# Marca UPchip: so identidade. Templates, CSS, JS, fontes, messages e a logo do
# produto (img/idm.png + slogan do painel) vem do tema-mae (parent=default); as cores
# estao em resources/css/brand.css e o monograma/favicon em resources/img/ desta marca
# (losango recortado do Manual de Identidade Visual; trocar pela arte vetorial se
# a agencia fornecer). NAO declarar styles=/scripts=: um valor no filho substitui
# a lista inteira herdada.
# PROVISORIO: links das politicas ainda vazios.
parent=default

# Alt do monograma. Nome proprio: fica aqui e nao nas messages (nao se traduz).
appBrandName=UPchip
# Links do rodape; vazio ou ausente, os templates caem para "#".
appPrivacyUrl=
appTermsUrl=
