# Marca UPchip: so identidade. Templates, CSS, JS, fontes, messages, o slogan e o
# globo do painel vem do tema-mae (parent=default); as cores estao em
# resources/css/brand.css e o monograma (logo-single.png: cabecalho dos e-mails e
# canto superior esquerdo do login, sem filtro, ver --app-logo-filter no brand.css)
# e o favicon em resources/img/ desta marca (losango recortado do Manual de
# Identidade Visual; trocar pela arte vetorial se a agencia fornecer). NAO declarar
# styles=/scripts=: um valor no filho substitui a lista inteira herdada.
# PROVISORIO: links das politicas ainda vazios.
parent=default

# Alt do monograma. Nome proprio: fica aqui e nao nas messages (nao se traduz).
appBrandName=UPchip
# Links do rodape; vazio, ausente ou sem http(s)://, os templates caem para "#".
appPrivacyUrl=
appTermsUrl=
