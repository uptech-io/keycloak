# Marca UPchip nos e-mails: so identidade; wrapper, corpos e messages vem do tema-mae
# (parent=default). Cores do Manual de Identidade Visual (raiz do repo), p.1.
# PROVISORIO: links das politicas ainda vazios.
parent=default

# Links do rodape — manter iguais aos de login/theme.properties. Vazio => "#".
appPrivacyUrl=
appTermsUrl=
# Marca: sempre no copyright do rodape; no resto (title, cabecalho, aviso final) so se realmName estiver vazio.
appBrandName=UPchip

# Cores do wrapper (html/template.ftl do default): cabecalho, titulos, CTA e codigo,
# e o texto sobre elas. Manter em sincronia com login/resources/css/brand.css:
# laranja #BD4B00 (Pantone 021 C escurecido; 5.0:1 com branco).
appColorPrimary=#BD4B00
appColorOnPrimary=#FFFFFF

# Logo dos e-mails: a do PRODUTO (idm.png branca do default), servida pelo Keycloak
# sob o caminho desta marca (o Keycloak resolve recursos pela cadeia de heranca).
# O segmento "vvbjh" e o id de recursos da instancia (ver README, secao E-mails).
# A variavel de ambiente UPCHIP_LOGO_URL sobrescreve o valor (ex.: CDN).
appLogoUrl=${env.UPCHIP_LOGO_URL:https://sso.uptech.com.br/resources/vvbjh/login/upchip/img/idm.png}
