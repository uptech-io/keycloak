# =============================================================================
# Uptech SSO — overrides de mensagens (pt-BR)
# Sobrescreve apenas as chaves desejadas; o restante vem das traducoes
# nativas do Keycloak. Arquivo em UTF-8.
# =============================================================================

# Rotulo do campo de e-mail: "Endereco de email" -> "E-mail"
email=E-mail

# Instrucao do "Esqueceu sua senha?": apenas e-mail (remove "nome de usuario ou")
emailInstruction=Digite seu endereço de email e nós lhe enviaremos instruções sobre como criar uma nova senha.

# Remove o texto "Forneca um nome de dispositivo para ajuda-lo a gerenciar..."
# na tela de cadastro do OTP (esvaziada; o <p> vazio e escondido no style.css).
loginTotpStep3DeviceName=

# Observacao: o prefixo "Continuar com " dos botoes sociais NAO fica aqui — o
# Keycloak renderiza so o "display name" do IdP, entao o prefixo e aplicado via
# CSS (.kc-social-provider-name::before, com variantes por html[lang]).

# Textos estaticos do tema (divisor, rodape, toast e painel lateral/aside).
appOr=ou
appRights=Todos os direitos reservados.
appPrivacyPolicy=Política de Privacidade
appTermsPolicy=Política de Uso
appClose=Fechar
appWelcomeTitle=Conectividade IoT/M2M com controle operacional
appWelcomeSubtitle=Conecte ativos, operadoras e sistemas em uma camada única de gestão.
