parent=keycloak
import=common/keycloak

# Mantém o CSS base do tema keycloak (css/login.css, herdado por resolução de recursos) e aplica o nosso por cima — o ultimo da lista vence.
styles=css/login.css css/style.css

# JS do tema (carregado como arquivo externo — o CSP do KC bloqueia <script> inline).
scripts=js/toast.js js/otp-segments.js
meta=viewport==width=device-width,initial-scale=1
# Nome da marca (usado no alt do logo). Nome proprio — nao traduzido.
appBrandName=Uptech
# URLs do rodape (politicas). Defina as URLs reais; default "#".
appPrivacyUrl=https://www.uptech.com.br/privacy-policy
appTermsUrl=https://www.uptech.com.br/usage-policy
