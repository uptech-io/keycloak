parent=keycloak

# URLs do rodape (politicas) — mesmas do tema de login.
appPrivacyUrl=https://www.uptech.com.br/privacy-policy
appTermsUrl=https://www.uptech.com.br/usage-policy
# Nome da marca (fallback do cabecalho quando realmName estiver vazio).
appBrandName=Uptech

# Logo nos e-mails: precisa ser uma URL PUBLICA e ABSOLUTA (clientes de e-mail
# nao carregam imagens locais do tema). A idm.png e branca/transparente — ideal
# para o cabecalho azul escuro. Vazio => usa so o nome do realm como marca.
# Servida pelo proprio Keycloak (tema de login). ATENCAO: o segmento "vvbjh" e a
# versao de recursos do KC e MUDA ao atualizar a versao do Keycloak — se mudar,
# atualize esta URL (senao o e-mail mostra imagem quebrada).
appLogoUrl=https://sso.uptech.com.br/resources/vvbjh/login/uptech/img/idm.png
