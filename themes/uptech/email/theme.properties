# Marca Uptech nos e-mails: so identidade; wrapper, corpos e messages vem do tema-mae
# (parent=default). Cores: as da casa (fallback do html/template.ftl), sem chave aqui.
parent=default

# Links do rodape — manter iguais aos de login/theme.properties.
appPrivacyUrl=https://www.uptech.com.br/privacy-policy
appTermsUrl=https://www.uptech.com.br/usage-policy
# Marca: sempre no copyright do rodape; no resto (title, cabecalho, aviso final) so se realmName estiver vazio.
appBrandName=UPTECH

# Logo dos e-mails: URL publica e absoluta (clientes de e-mail nao carregam
# imagens locais do tema), servida pelo proprio Keycloak: o monograma da marca
# (logo-single.png, navy sobre transparente), para o cabecalho BRANCO dos e-mails.
# O arquivo mora no default, mas o caminho usa este tema (login/uptech/...): o
# Keycloak resolve recursos pela cadeia de heranca.
# Vazio => o cabecalho vira texto (nome do realm).
# O segmento "vvbjh" e o id de recursos da instancia (aleatorio por banco, refeito
# a cada migracao/upgrade). Um id defasado mas bem formado (5 caracteres [0-9a-z])
# continua funcionando: o Keycloak responde 307 para o atual; atualiza-lo apos o
# upgrade (copiar de uma URL real da producao) so evita o redirect.
# Variavel de ambiente UPTECH_LOGO_URL sobrescreve o valor sem editar o tema (ex.: CDN);
# APP_LOGO_URL e o nome antigo, aceito como segunda opcao ate os deploys migrarem.
# ATENCAO: a imagem precisa funcionar sobre BRANCO; um deploy que ainda aponte essas
# variaveis para a antiga logo branca fica com o cabecalho sem logo visivel.
appLogoUrl=${env.UPTECH_LOGO_URL,env.APP_LOGO_URL:https://sso.uptech.com.br/resources/vvbjh/login/uptech/img/logo-single.png}
