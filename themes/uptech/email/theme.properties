parent=keycloak
# Idiomas do tema (serverinfo); nao restringe os Supported locales do realm.
# Novo idioma = novo messages_xx.properties nos dois temas.
locales=pt-BR,en,es

# Links do rodape — manter iguais aos de login/theme.properties.
appPrivacyUrl=https://www.uptech.com.br/privacy-policy
appTermsUrl=https://www.uptech.com.br/usage-policy
# Marca: sempre no copyright do rodape; no resto (title, cabecalho, aviso final) so se realmName estiver vazio.
appBrandName=Uptech

# Logo dos e-mails: URL publica e absoluta (clientes de e-mail nao carregam
# imagens locais do tema), servida pelo proprio Keycloak; a idm.png e branca,
# para o cabecalho escuro. Vazio => o cabecalho vira texto (nome do realm).
# ATENCAO: o segmento "vvbjh" e um id aleatorio por banco, refeito a cada
# migracao de banco (upgrade do KC) — copiar de uma URL real da instancia de producao.
# A variavel de ambiente APP_LOGO_URL sobrescreve o valor sem editar o tema (ex.: CDN).
appLogoUrl=${env.APP_LOGO_URL:https://sso.uptech.com.br/resources/vvbjh/login/uptech/img/idm.png}
