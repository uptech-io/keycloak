# Console da conta (keycloak.v3): só o rótulo do nome de usuário, que no produto é o CPF
# (o display name do atributo `username` no User Profile é ${username}). O v3 carrega os
# textos por /resources/<realm>/account/<locale>, que percorre a cadeia de temas
# (marca -> default -> keycloak.v3 -> base): vale para todas as marcas.
username=CPF
