# Console da conta (Minha conta): SPA React/PatternFly 5 do keycloak.v3. So ha o
# que o index.ftl do pai le daqui: logo, logoUrl, styles, scripts, favIcon,
# title/description, darkMode, locales. Nao ha template para sobrescrever.
# Tema-mae: as marcas declaram parent=default e trocam css/brand.css e img/.
# abstract=true tira o default da lista de temas do Admin Console.
parent=keycloak.v3
abstract=true
locales=pt-BR,en,es

# Marca clara, como o login: desliga o modo escuro automatico do console.
darkMode=false

# Carregados depois do CSS do PatternFly; a marca entra por variaveis --pf-v5-*.
# brand.css traz os tokens de cor que o account.css consome (as marcas filhas trocam
# esse arquivo e NAO devem redeclarar styles=, senao perdem a lista inteira).
styles=css/account.css css/brand.css

# Logo do cabecalho (relativa a resources/) e destino do clique ("/" = inicio do console).
logo=img/idm.png
logoUrl=/
# favIcon e concatenado direto ao resourceUrl: precisa comecar com "/".
favIcon=/img/favicon.ico
favIconType=image/x-icon
title=Minha conta
description=Gerencie os dados, a senha e os dispositivos da sua conta.
