# CPF as username (whole product, every brand): base label and messages that say "username".
# The mask is js/cpf-mask.js; the server only ever receives the digits. The mode follows the
# realm (Login with email / Email as username): messages Keycloak shows in every mode are
# neutral; the ones that say CPF only appear when the field is the CPF.
