accountPermanentlyDisabledMessage=Invalid login details.
invalidUsernameMessage=Invalid CPF.
invalidUsernameOrEmailMessage=Account not found.
missingUsernameMessage=This field is required.
usernameExistsMessage=This CPF is already registered.
