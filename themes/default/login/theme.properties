parent=keycloak
import=common/keycloak
# Tema-mae: templates, CSS, JS, fontes e messages ficam aqui. As marcas (uptech,
# upchip) declaram parent=default e sobrescrevem so a identidade: as chaves app*
# de marca (appBrandName, appPrivacyUrl, appTermsUrl) e, se as cores forem outras,
# o css/brand.css. Nao ha chave de marca aqui de proposito: chave ausente no filho
# cai no fallback do template (para appBrandName, literalmente "Uptech", a casa),
# nunca no theme.properties de outra marca — conferir as chaves em toda marca nova.
# abstract=true tira o default da lista de temas do Admin Console; as marcas
# continuam selecionaveis (o Keycloak le a flag so do tema escolhido).
abstract=true
#
# Idiomas do tema (serverinfo + rotulos locale_xx do seletor); nao restringe os Supported
# locales do realm. Novo idioma = locales= nos tres theme.properties (login, email,
# account) + messages_xx.properties em login, email e account (neste, so username=CPF).
locales=pt-BR,en,es

# css/login.css vem do tema pai (resolução de recursos); style.css depois, para vencer
# na cascata; brand.css por último com os tokens de marca (as marcas filhas trocam
# esse arquivo e NAO devem redeclarar styles=, senão perdem a lista inteira).
styles=css/login.css css/style.css css/brand.css

# Convencao: JS proprio so em arquivo externo listado aqui (o template.ftl emite os
# <script src>); o JS inline do <head> e copia do base, nao e nosso.
scripts=js/toast.js js/otp-segments.js js/passkey.js js/cpf-mask.js
meta=viewport==width=device-width,initial-scale=1

# Icones das telas de chave de seguranca (webauthn-authenticate, login com passkey)
# e de escolha de metodo (select-authenticator): classes nossas, desenhadas por
# mask-image SVG no style.css (secao "Chave de seguranca"). Substituem FontAwesome/PF.
kcWebAuthnDefaultIcon=app-icon app-icon--key
kcWebAuthnKeyIcon=app-icon app-icon--key
kcWebAuthnUnknownIcon=app-icon app-icon--key
kcWebAuthnUSB=app-icon app-icon--usb
kcWebAuthnNFC=app-icon app-icon--nfc
kcWebAuthnBLE=app-icon app-icon--bluetooth
kcWebAuthnInternal=app-icon app-icon--device
kcAuthenticatorDefaultClass=app-icon app-icon--codes
kcAuthenticatorRecoveryAuthnCodesClass=app-icon app-icon--codes
kcAuthenticatorPasswordClass=app-icon app-icon--password
kcAuthenticatorOTPClass=app-icon app-icon--otp
kcAuthenticatorWebAuthnClass=app-icon app-icon--key
kcAuthenticatorWebAuthnPasswordlessClass=app-icon app-icon--key
kcSelectAuthListItemIconPropertyClass=
kcSelectAuthListItemArrowIconClass=app-icon app-icon--chevron
