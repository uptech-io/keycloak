parent=keycloak
# Tema-mae dos e-mails: wrapper, corpos e messages ficam aqui. As marcas declaram
# parent=default e so as chaves de identidade (appBrandName, appPrivacyUrl,
# appTermsUrl, appLogoUrl) e de cor (appColorPrimary, appColorOnPrimary), lidas
# pelo html/template.ftl. Nenhuma delas fica aqui de proposito: chave ausente no
# filho cai no fallback do template (os valores da casa — para appBrandName,
# literalmente "Uptech"), nunca no theme.properties de outra marca.
# abstract=true tira o default da lista de temas do Admin Console.
abstract=true
#
# Idiomas do tema (serverinfo); nao restringe os Supported locales do realm.
# Novo idioma = locales= nos tres theme.properties (login, email, account)
# + messages_xx.properties em login, email e account (neste, so username=CPF).
locales=pt-BR,en,es
