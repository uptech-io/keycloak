# Every value goes through MessageFormat: write a literal apostrophe as '' (a lone ' is swallowed).

# Subjects (override the base theme translations)
passwordResetSubject=Reset your password
emailVerificationSubject=Confirm your email
executeActionsSubject=Action required on your account

# Footer
appRights=All rights reserved.
appPrivacyPolicy=Privacy Policy
appTermsPolicy=Terms of Use
appEmailDisclaimer=You received this email from {0}.

# Common
appLinkExpires=This link expires in {0}.

# Password reset
appResetTitle=Reset your password
appResetIntro=Someone requested a change to your account credentials. If this was you, click the button below to set a new password.
appResetCta=Reset password
appResetIgnore=If you didn''t request this, ignore this email — your password stays the same.

# Email verification
appVerifyTitle=Confirm your email
appVerifyIntro=Almost there! Confirm your email address to activate your account.
appVerifyCta=Confirm email
appVerifyIgnore=If you didn''t create this account, ignore this email.

# Execute actions (update account)
appActionsTitle=Update your account
appActionsIntro=Your administrator requested that you update your account. Click the button below to continue.
appActionsCta=Update account
appActionsIgnore=If you weren''t expecting this email, ignore it and nothing will change.

# Verification code (email OTP)
appCodeTitle=Your verification code
appCodeIntro=Use the code below to verify your email:
appCodeIgnore=If you didn''t request this code, ignore this email.

# Plain-text part of the multipart (email/text templates inherited from base). {0}=link, or the code in ...BodyCode; {3}/{4}=expiration.
passwordResetBody=Someone requested a change to your account credentials. If this was you, open the link below to set a new password.\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn''t request this, ignore this email — your password stays the same.
emailVerificationBody=Almost there! Confirm your email address to activate your account using the link below.\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn''t create this account, ignore this email.
executeActionsBody=Your administrator requested that you update your account. Open the link below to continue.\n\n{0}\n\nThis link expires in {4}.\n\nIf you weren''t expecting this email, ignore it and nothing will change.
emailVerificationBodyCode=Use the code below to verify your email:\n\n{0}\n\nIf you didn''t request this code, ignore this email.
